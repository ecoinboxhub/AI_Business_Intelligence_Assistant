services:
  - type: web
    name: nexasphere-bi
    runtime: image
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: MOCK_DATASET_SIZE
        value: "500000"
      - key: MOCK_DELIVERY_SIZE
        value: "100000"
      - key: CORS_ORIGINS
        value: "https://ecoinboxhub.github.io,https://nexasphere-bi.onrender.com,http://localhost:3030"
