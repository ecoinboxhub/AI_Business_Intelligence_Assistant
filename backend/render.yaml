services:
  - type: web
    name: nexasphere-bi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: MOCK_DATASET_SIZE
        value: "500000"
      - key: MOCK_DELIVERY_SIZE
        value: "100000"
      - key: CORS_ORIGINS
        value: "https://ecoinboxhub.github.io,https://nexasphere-bi.onrender.com,http://localhost:3030"
    healthCheckPath: /api/health
