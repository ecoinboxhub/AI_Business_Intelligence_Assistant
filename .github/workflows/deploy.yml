name: NexaSphere CI/CD & GitHub Hosting Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: BACKEND CI & ACCURACY VERIFICATION
  # -------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest & Accuracy Benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd backend
          pytest

  # -------------------------------------------------------------
  # JOB 2: FRONTEND BUILD & GITHUB PAGES DEPLOYMENT
  # -------------------------------------------------------------
  deploy-frontend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      # Pages hosting is only meaningful on pushes to main; PRs still get a full build above.
      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # JOB 3: ANDROID APK BUILD & GITHUB RELEASES
  # -------------------------------------------------------------
  release-mobile:
    needs: test-backend
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Generate Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Optimize Android Build
        run: |
          # Limit to ARM architectures only (drop x86/x86_64 for smaller APK)
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' mobile/android/gradle.properties
          # Enable ProGuard minification
          sed -i "s/def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?.*/def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: true).toBoolean()/" mobile/android/app/build.gradle
          # Enable resource shrinking
          sed -i 's/shrinkResources (findProperty(.android.enableShrinkResourcesInReleaseBuilds.)?.toBoolean() ?: false)/shrinkResources (findProperty("android.enableShrinkResourcesInReleaseBuilds")?.toBoolean() ?: true)/' mobile/android/app/build.gradle
          echo "Optimizations applied"

      - name: Make Gradlew Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Release APK
        run: |
          cd mobile/android
          ./gradlew assembleRelease

      - name: Locate APK
        id: find-apk
        run: |
          APK_PATH=$(find mobile/android -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          cp "${{ steps.find-apk.outputs.apk_path }}" "NexaSphere-Mobile-${VERSION}.apk"
          echo "Renamed to NexaSphere-Mobile-${VERSION}.apk"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: NexaSphere-Mobile-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
