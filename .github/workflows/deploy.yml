name: NexaSphere CI/CD & GitHub Hosting Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: BACKEND CI & ACCURACY VERIFICATION
  # -------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest & Accuracy Benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd backend
          pytest

  # -------------------------------------------------------------
  # JOB 2: FRONTEND BUILD & GITHUB PAGES DEPLOYMENT
  # -------------------------------------------------------------
  deploy-frontend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      # Pages hosting is only meaningful on pushes to main; PRs still get a full build above.
      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # JOB 3: MOBILE APK BUILD & GITHUB RELEASES PUBLISHING
  # -------------------------------------------------------------
  release-mobile:
    needs: test-backend
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Export Expo Web/Android Bundle
        run: |
          cd mobile
          npx expo export --platform web

      - name: Zip Bundle Artifact
        run: |
          cd mobile/dist
          zip -r ../../mobile-release.zip .

      - name: Create GitHub Release & Upload Binary
        uses: softprops/action-gh-release@v1
        with:
          files: mobile-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
